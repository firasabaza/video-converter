[project]
name = "video-converter"
version = "1.0.0"
description = "Convertisseur vidéo local avec accélération matérielle (VideoToolbox, NVENC, Quick Sync, AMF, VAAPI) basé sur FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
video-converter = "video_converter.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
