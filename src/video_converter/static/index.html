<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur vidéo</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7;
    --accent: #0a66d8; --accent-soft: #e6f0fc; --ok: #1a7f37; --warn: #9a6700; --err: #c62828;
    --bar-bg: #e8e8ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --text: #f2f2f4; --muted: #a1a1a6; --border: #3a3a3e;
      --accent: #4c9bff; --accent-soft: #1d2b3e; --ok: #4ac26b; --warn: #d4a72c; --err: #ff6b6b;
      --bar-bg: #2c2c30;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 24px; margin: 0; }
  .accel { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .accel.cpu { background: var(--bar-bg); color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); font: inherit; }
  .hint { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  #drop { margin-top: 16px; border: 2px dashed var(--border); border-radius: 12px; padding: 40px 16px;
          text-align: center; cursor: pointer; transition: border-color .15s, background .15s; background: var(--panel); }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 13px; }
  .bar-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .job { padding: 12px 0; border-top: 1px solid var(--border); }
  .job:first-child { border-top: 0; }
  .job-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .job-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .job-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .progress { height: 8px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .done .progress > div { background: var(--ok); }
  .error .progress > div { background: var(--err); }
  .msg { font-size: 12px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .msg.warn { color: var(--warn); } .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 8px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Convertisseur vidéo</h1>
    <span id="accel" class="accel">Détection…</span>
  </header>

  <section class="panel settings">
    <div><label for="format">Format de sortie</label><select id="format"></select></div>
    <div><label for="codec">Codec vidéo</label><select id="codec"></select></div>
    <div><label for="quality">Qualité</label><select id="quality"></select></div>
    <div><label for="backend">Accélération</label><select id="backend"></select></div>
    <div id="hint" class="hint"></div>
  </section>

  <div id="drop" tabindex="0" role="button" aria-label="Choisir des vidéos à convertir">
    <strong>Déposez vos vidéos ici</strong>
    <span>ou cliquez pour choisir des fichiers — MKV, MP4, MOV, AVI, WebM, etc.</span>
    <input id="file" type="file" accept="video/*,.mkv,.avi,.flv,.wmv,.ts,.m2ts,.mts,.3gp,.ogv" multiple hidden>
  </div>

  <section class="panel">
    <div class="bar-row">
      <span>Fichiers convertis dans : <span id="outdir">…</span></span>
      <span class="actions">
        <button id="open">Ouvrir le dossier</button>
        <button id="clear">Effacer la liste</button>
      </span>
    </div>
  </section>

  <section class="panel" id="jobs"><div class="empty">Aucune conversion pour l'instant.</div></section>

  <footer id="footer"></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let info = null;
const uploads = new Map(); // id local -> {name, loaded, total, error}
let serverJobs = [];

function option(value, label) { const o = document.createElement("option"); o.value = value; o.textContent = label; return o; }

function remember(key, value) { try { localStorage.setItem("vc." + key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem("vc." + key); } catch (e) { return null; } }

function encoderHint() {
  const codec = $("codec").value, backend = $("backend").value, caps = info.capabilities;
  let text;
  if (codec === "copy") text = "La vidéo est copiée telle quelle (pas de réencodage) ; seul l'audio est converti.";
  else {
    const hw = backend === "cpu" ? [] : caps.hardware.filter(h => (backend === "auto" || backend === h.id) && h.codecs.includes(codec));
    if (hw.length) text = `Encodeur : ${hw[0].label} (matériel). Repli automatique sur le CPU en cas d'échec.`;
    else if (caps.cpu[codec]) text = `Encodeur : ${caps.cpu[codec]} (CPU)` + (backend === "cpu" ? "." : " — pas d'encodeur matériel pour ce codec ici.");
    else text = "Aucun encodeur disponible pour ce codec dans votre FFmpeg.";
  }
  $("hint").textContent = text;
}

function fillCodecs() {
  const fmt = info.formats[$("format").value];
  const previous = $("codec").value || recall("codec");
  $("codec").replaceChildren(...fmt.codecs.map(c => option(c, info.codecs[c])));
  if (fmt.codecs.includes(previous)) $("codec").value = previous;
  encoderHint();
}

async function init() {
  info = await (await fetch("/api/info")).json();
  const caps = info.capabilities;
  const accel = $("accel");
  if (caps.hardware.length) {
    accel.textContent = "Accélération : " + caps.hardware.map(h => h.label).join(", ");
  } else {
    accel.textContent = caps.forced_cpu ? "Accélération désactivée — encodage CPU" : "Pas d'accélération matérielle — encodage CPU";
    accel.classList.add("cpu");
  }
  $("format").replaceChildren(...Object.entries(info.formats).map(([k, f]) => option(k, f.label)));
  $("quality").replaceChildren(...Object.entries(info.qualities).map(([k, l]) => option(k, l)));
  $("backend").replaceChildren(option("auto", "Automatique"), ...caps.hardware.map(h => option(h.id, h.label)), option("cpu", "CPU uniquement"));
  for (const id of ["format", "quality", "backend"]) {
    const saved = recall(id);
    if (saved && [...$(id).options].some(o => o.value === saved)) $(id).value = saved;
    else if (id === "quality") $(id).value = "balanced";
  }
  fillCodecs();
  $("format").onchange = () => { remember("format", $("format").value); fillCodecs(); };
  $("backend").onchange = () => { remember("backend", $("backend").value); fillCodecs(); };
  $("codec").onchange = () => { remember("codec", $("codec").value); encoderHint(); };
  $("quality").onchange = () => remember("quality", $("quality").value);
  $("outdir").textContent = info.output_dir;
  $("footer").textContent = "FFmpeg " + info.ffmpeg_version + " · tout reste sur cet ordinateur";
  refresh();
  setInterval(refresh, 700);
}

function upload(file) {
  const localId = "u" + Math.random().toString(36).slice(2);
  uploads.set(localId, { name: file.name, loaded: 0, total: file.size });
  const params = new URLSearchParams({
    name: file.name, format: $("format").value, codec: $("codec").value,
    quality: $("quality").value, backend: $("backend").value,
  });
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/jobs?" + params);
  xhr.upload.onprogress = (e) => { const u = uploads.get(localId); if (u) { u.loaded = e.loaded; render(); } };
  xhr.onload = () => {
    if (xhr.status === 200) uploads.delete(localId);
    else {
      let detail = xhr.statusText;
      try { detail = JSON.parse(xhr.responseText).detail; } catch (e) {}
      uploads.get(localId).error = detail || "Erreur d'envoi";
    }
    refresh();
  };
  xhr.onerror = () => { uploads.get(localId).error = "Le serveur local ne répond pas."; render(); };
  xhr.send(file);
  render();
}

async function refresh() {
  try { serverJobs = await (await fetch("/api/jobs")).json(); } catch (e) {}
  render();
}

function fmtTime(s) {
  if (s == null) return "";
  s = Math.round(s);
  return s >= 60 ? Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s" : s + " s";
}

const STATUS = { queued: "En attente", running: "Conversion", done: "Terminé", error: "Erreur", cancelled: "Annulé" };

function render() {
  const box = $("jobs");
  const rows = [];
  for (const [id, u] of uploads) {
    const pct = u.total ? u.loaded / u.total : 0;
    rows.push(`<div class="job ${u.error ? "error" : ""}">
      <div class="job-head"><div class="job-name">${esc(u.name)}</div></div>
      <div class="job-meta">${u.error ? "Erreur" : "Envoi au convertisseur… " + Math.round(pct * 100) + " %"}</div>
      <div class="progress"><div style="width:${pct * 100}%"></div></div>
      ${u.error ? `<div class="msg err">${esc(u.error)}</div>` : ""}</div>`);
  }
  for (const j of [...serverJobs].reverse()) {
    const pct = Math.round(j.progress * 1000) / 10;
    let meta = `${STATUS[j.status]} · ${j.format.toUpperCase()} · ${esc(info.codecs[j.codec].split(" (")[0])} · ${esc(info.qualities[j.quality])}`;
    if (j.encoder) meta += j.encoder === "copy" ? " · sans réencodage" : ` · ${esc(j.accelerator)} (${esc(j.encoder)})`;
    if (j.status === "running") meta += ` · ${pct} %` + (j.speed ? ` · ${j.speed.toFixed(1)}×` : "") + (j.eta != null ? ` · reste ${fmtTime(j.eta)}` : "");
    if (j.status === "done") meta += ` · ${fmtTime(j.elapsed)}`;
    let msg = "";
    if (j.status === "error") msg = `<div class="msg err">${esc(j.message)}</div>`;
    else if (j.fallback) msg = `<div class="msg warn">${esc(j.message)}</div>`;
    if (j.status === "done") msg += `<div class="msg ok">→ ${esc(j.output_name)}</div>`;
    const actions = (j.status === "running" || j.status === "queued")
      ? `<button data-cancel="${j.id}">Annuler</button>`
      : j.status === "done" ? `<a href="/api/jobs/${j.id}/download"><button>Télécharger</button></a>` : "";
    rows.push(`<div class="job ${j.status}">
      <div class="job-head"><div class="job-name">${esc(j.name)}</div><div class="actions">${actions}</div></div>
      <div class="job-meta">${meta}</div>
      <div class="progress"><div style="width:${j.status === "done" ? 100 : pct}%"></div></div>${msg}</div>`);
  }
  box.innerHTML = rows.length ? rows.join("") : `<div class="empty">Aucune conversion pour l'instant.</div>`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = (e) => { [...e.target.files].forEach(upload); e.target.value = ""; };
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => [...e.dataTransfer.files].forEach(upload));
// Un dépôt à côté de la zone ne doit pas ouvrir la vidéo dans le navigateur.
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

$("jobs").addEventListener("click", async (e) => {
  const id = e.target.dataset.cancel;
  if (id) { await fetch(`/api/jobs/${id}/cancel`, { method: "POST" }); refresh(); }
});
$("open").onclick = () => fetch("/api/open-output", { method: "POST" });
$("clear").onclick = async () => {
  for (const [id, u] of uploads) if (u.error) uploads.delete(id);
  await fetch("/api/jobs/clear", { method: "POST" }); refresh();
};

init();
</script>
</body>
</html>
